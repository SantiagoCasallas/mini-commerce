name: Verify Mini Commerce
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mini_commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d mini_commerce"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run test:config && npm run build
        working-directory: frontend
      - run: mvn -B verify
        working-directory: backend
      - name: Verify business rules against PostgreSQL
        run: >-
          mvn -B test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/mini_commerce
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=commerce
          -Dspring.datasource.password=commerce
        working-directory: backend
      - run: docker build -t mini-commerce:ci .
