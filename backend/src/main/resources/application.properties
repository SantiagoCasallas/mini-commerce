spring.application.name=mini-commerce
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mini_commerce}
spring.datasource.username=${DATABASE_USER:commerce}
spring.datasource.password=${DATABASE_PASSWORD:commerce}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
